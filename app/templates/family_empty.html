{% extends "layout.html" %}
{% block title %}还没有家庭 · kids时光机{% endblock %}
{% block content %}
<div class="center">
  <div class="illus">🏠</div>
  <h3>还没有家庭</h3>
  <p>创建一个只给家人看的空间，把孩子的日子按天留下来。</p>
  {% if error %}<p class="hint err">{{ error }}</p>{% endif %}
  <form method="post" action="/families" class="stack">
    <label class="field"><span>家庭名称</span>
      <input class="input" name="name" required maxlength="40" placeholder="我们家">
    </label>
    <button class="btn" type="submit">创建我们的家庭</button>
  </form>
  <p class="hint">无公开直链 · 非成员不可见</p>
</div>
{% endblock %}
