{% extends "layout.html" %}
{% block title %}登录 · kids时光机{% endblock %}
{% block content %}
<div class="center">
  <div class="illus">✉️</div>
  <h3>kids时光机</h3>
  <p>用邮箱登录。验证码只记在这台服务上，本版不发真实邮件。</p>
  {% if error %}<p class="hint err">{{ error }}</p>{% endif %}
  <form method="post" action="/login/request" class="stack">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span>邮箱</span>
      <input class="input" type="email" name="email" required maxlength="255" autocomplete="username" value="{{ email }}" placeholder="you@example.com">
    </label>
    <button class="btn" type="submit">发送验证码</button>
  </form>
  {% if test_code_enabled %}
  <p class="hint">已开启测试码。先发送验证码，再输入 README 里的测试码。</p>
  {% endif %}
</div>
{% endblock %}
