# Phase A self-host. The data volume stays mounted for local media even when
# STORAGE_BACKEND=s3, so older local keys remain readable.
services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - app-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  app-data:
